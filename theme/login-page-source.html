<style>
html,body{margin:0!important;padding:0!important;background:#0d0719!important;color:#f7f2ff!important;font-family:Arial,Helvetica,sans-serif!important}
.trc-login-wrap{min-height:100vh;box-sizing:border-box;padding:24px 10px 40px;background:radial-gradient(ellipse at 50% 0%,#291344 0%,#150d25 48%,#0d0719 100%);display:flex;align-items:flex-start;justify-content:center}
.trc-profile-auth{width:100%;max-width:620px;margin:0 auto;padding:24px 20px 28px;box-sizing:border-box;text-align:center;border:1px solid rgba(174,126,222,.48);border-radius:28px;background:linear-gradient(145deg,rgba(37,23,54,.98),rgba(18,11,31,.98));box-shadow:0 18px 55px rgba(20,7,36,.55),0 0 24px rgba(137,79,190,.12)}
.trc-profile-auth-logo{width:140px;height:140px;margin:0 auto 18px;border:3px solid #a96be0;border-radius:50%;overflow:hidden;box-shadow:0 0 22px rgba(169,107,224,.38)}
.trc-profile-auth-logo img{display:block;width:100%;height:100%;object-fit:cover}
.trc-profile-auth h2{margin:0 auto 5px;font-size:clamp(21px,5vw,34px);line-height:1.12;font-weight:900;letter-spacing:-.4px;color:#bd83ff}
.trc-auth-brandline{margin:8px 0 10px;color:#c69af0;font-size:13px;font-weight:800;letter-spacing:2.5px}
.trc-auth-subtitle{margin:0 auto 22px;color:#b4a4c8;font-size:16px;line-height:1.45}
.trc-auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.trc-auth-tabs button{height:58px;border:2px solid rgba(174,126,222,.36);border-radius:16px;background:linear-gradient(145deg,#1b1228,#100b19);color:#ded0ef;font-size:17px;font-weight:900}
.trc-auth-tabs button.active{background:linear-gradient(120deg,#7136a5,#a45bd0);border-color:#bd83ff;color:#fff;box-shadow:0 8px 22px rgba(137,79,190,.28)}
.trc-auth-form{display:grid;gap:12px}
.trc-auth-form label{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:64px;border:2px solid rgba(174,126,222,.58);border-radius:18px;background:rgba(12,8,21,.88);color:#c69af0}
.trc-auth-form label svg{width:24px;height:24px;flex:0 0 24px;fill:none;stroke:currentColor;stroke-width:2}
.trc-auth-form input{width:100%;min-width:0;border:0!important;outline:0!important;background:transparent!important;color:#fff!important;font-size:17px!important}
.trc-auth-form input::placeholder{color:#b4a4c8}
.trc-auth-form .trc-signup-name{display:none}
.trc-profile-auth.signup-mode .trc-auth-form .trc-signup-name{display:block}
.trc-auth-options{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#ddd}
.trc-remember{display:flex;align-items:center;gap:8px;font-size:14px}
.trc-remember input{width:18px;height:18px;accent-color:#9b62c9}
.trc-forgot{border:0;background:none;color:#c69af0;font-weight:800;font-size:14px}
.trc-auth-submit{height:64px;border:0;border-radius:18px;background:linear-gradient(115deg,#7136a5 0%,#9b55c9 55%,#bd83ff 100%);color:white;font-size:18px;font-weight:900;box-shadow:0 10px 24px rgba(137,79,190,.28)}
.trc-auth-divider{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:#c6a5e8}
.trc-auth-divider:before,.trc-auth-divider:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,#a96be0)}
.trc-auth-divider:after{background:linear-gradient(90deg,#a96be0,transparent)}
.trc-auth-social{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trc-auth-social button{min-height:76px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 5px;border:2px solid rgba(174,126,222,.72);border-radius:17px;background:linear-gradient(145deg,#21152f,#100b1b);color:#fff;font-size:13px;font-weight:800;box-shadow:0 0 7px rgba(169,107,224,.5),0 0 17px rgba(137,79,190,.28)}
.trc-auth-social svg{width:24px;height:24px;flex:0 0 24px}
.trc-auth-footnote{margin:16px 0 0;color:#b4a4c8;font-size:13px}
@media(max-width:420px){.trc-login-wrap{padding:16px 6px 28px}.trc-profile-auth{padding:20px 14px 24px;border-radius:24px}.trc-profile-auth-logo{width:112px;height:112px}.trc-auth-tabs button{height:50px;font-size:14px}.trc-auth-form label{min-height:58px}.trc-auth-submit{height:58px}.trc-auth-social{gap:6px}.trc-auth-social button{font-size:11px;gap:3px;min-height:68px}.trc-auth-social svg{width:20px;height:20px;flex-basis:20px}}

/* TRC signup Full Name field — match Email and Password fields */
.trc-auth-form input.trc-signup-name{
  display:none;
  width:100%!important;
  min-width:0!important;
  height:68px!important;
  box-sizing:border-box!important;
  margin:0 0 22px!important;
  padding:0 24px!important;
  border:2px solid #76518f!important;
  border-radius:27px!important;
  outline:none!important;
  background:#100a1a!important;
  color:#f7f1ff!important;
  font:inherit!important;
  font-size:clamp(17px,4.5vw,25px)!important;
  line-height:1.2!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)!important;
}
.trc-auth-form input.trc-signup-name::placeholder{
  color:#b9a9c9!important;opacity:1!important;
}
.trc-auth-form input.trc-signup-name:focus{
  border-color:#b56be8!important;
  box-shadow:0 0 0 3px rgba(181,107,232,.14),0 0 18px rgba(181,107,232,.18)!important;
}
@media(max-width:600px){
  .trc-auth-form input.trc-signup-name{
    height:68px!important;
    margin-bottom:18px!important;
    padding:0 24px!important;
    border-radius:27px!important;
    font-size:clamp(17px,4.5vw,25px)!important;
  }
}


/* v6: equal signup field spacing and sizing */
.trc-profile-auth.signup-mode .trc-auth-form input.trc-signup-name{
 display:block!important; height:64px!important; min-height:64px!important;
 margin:0!important; padding:0 24px!important; border-radius:18px!important;
 border:2px solid rgba(174,126,222,.58)!important;
 background:rgba(12,8,21,.88)!important; box-shadow:none!important;
}
.trc-profile-auth.signup-mode .trc-auth-form{gap:12px!important}
@media(max-width:420px){.trc-profile-auth.signup-mode .trc-auth-form input.trc-signup-name{height:58px!important;min-height:58px!important}}
</style>
